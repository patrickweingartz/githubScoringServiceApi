name: Release Maven Package

on:
  release:
    types: [published]  # Trigger bei GitHub Release

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: github       # muss exakt mit pom.xml Repository id übereinstimmen
          settings-path: ${{ github.workspace }}  # dort wird settings.xml für Maven erzeugt

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Deploy to GitHub Packages
        run: mvn deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
