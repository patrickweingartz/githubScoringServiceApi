name: Release Maven Package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          server-id: github
          cache: maven

      - name: Set up Maven settings.xml for GitHub Packages
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>patrickweingartz</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.PATS_TOKEN }}

      - name: Build
        run: mvn clean package -DskipTests

      - name: Deploy
        run: mvn deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.PATS_TOKEN }}