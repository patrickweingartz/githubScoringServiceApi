name: Release Maven Package

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (without -SNAPSHOT)'
        required: false
        type: string
      developmentVersion:
        description: 'Next development version (with -SNAPSHOT)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  TZ: Europe/Berlin

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PATS_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Maven settings.xml for GitHub Packages
        run: |
          mkdir -p ~/.m2
          echo "<settings>
            <servers>
              <server>
                <id>github</id>
                <username>patrickweingartz</username>
                <password>${{ secrets.PATS_TOKEN }}</password>
              </server>
            </servers>
          </settings>" > ~/.m2/settings.xml

      - name: Maven Release Prepare
        run: |
          if [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            mvn release:prepare -B \
              -DreleaseVersion=${{ github.event.inputs.releaseVersion }} \
              -DdevelopmentVersion=${{ github.event.inputs.developmentVersion }} \
              -DskipTests
          else
            mvn release:prepare -B -DskipTests
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PATS_TOKEN }}

      - name: Maven Release Perform
        run: mvn release:perform -B -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.PATS_TOKEN }}