name: Release and publish package to github
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TZ: Europe/Berlin
      GITHUB_USER: patrickweingartz
      GITHUB_TOKEN: ${{ secrets.PATS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PATS_TOKEN }}
          ref: main
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'adopt'
          java-package: 'jdk'
          architecture: 'x64'
          cache: 'maven'

      - name: Configure git
        run: |
          git config --global user.name '@PbuBuildGitHub'
          git config --global user.email 'PbuBuildGitHub@europace.de'
        shell: bash
      - name: Maven release
        id: prepare
        env:
          USERNAME: 'patrickweingartz'
          PASSWORD: ${{ secrets.PATS_TOKEN }}
        run: |
          mvn --settings .github/workflows/settings.xml -B release:clean
          mvn --settings .github/workflows/settings.xml -B -P github release:prepare -DtagNameFormat=v@{project.version}
          mvn --settings .github/workflows/settings.xml -B -P github release:perform -Dusername=patrickweingartz -Dpassword=${{secrets.PATS_TOKEN}}
        shell: bash
      - name: Publish next development package to github repository
        run: mvn --settings .github/workflows/settings.xml -B -P github deploy
        shell: bash
        env:
          USERNAME: 'patrickweingartz'
          PASSWORD: ${{ secrets.PATS_TOKEN }}
