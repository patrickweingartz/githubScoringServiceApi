components:
  schemas:
    GithubRepository:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        stargazers_count:
          type: integer
        forks_count:
          type: integer
        updated_at:
          type: string
          format: date-time
          example: 2025-01-01T10:20:00Z
        popularityScoring:
          type: integer